name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y autoconf automake zlib1g-dev libbz2-dev liblzma-dev libcurl4-openssl-dev

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGIT_SUBMODULE=OFF

    - name: Build
      run: cmake --build build -j4

    - name: Test
      working-directory: build
      run: ctest --output-on-failure --no-tests=error -j4

    - name: Create source tarball (includes tld submodule)
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        ./packaging/make_source_tarball.sh "$VERSION" dist

    - name: Upload to GitHub release
      uses: softprops/action-gh-release@v2.2.2
      with:
        files: |
          dist/samstat-*.tar.gz
          dist/samstat-*.tar.gz.sha256
        generate_release_notes: true
